name: Update AltStore Source

on:
  workflow_dispatch: {}      # trigger manually from the Actions tab whenever you know there's a new release

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (the AltStore source repo)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest release, verify the .ipa, and update the source
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: NuvioMedia/NuvioMobile      # repo whose Releases you're watching
          SOURCE_FILE: NuvioiOS.json                 # file this workflow edits
          BUNDLE_ID: com.nuvio.media                 # expected CFBundleIdentifier — mismatch just prints a warning
        run: |
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import plistlib
          import re
          import sys
          import urllib.request
          import xml.etree.ElementTree as ET
          import zipfile

          repo = os.environ["RELEASE_REPO"]
          token = os.environ.get("GITHUB_TOKEN")
          source_file = os.environ["SOURCE_FILE"]
          expected_bundle_id = os.environ["BUNDLE_ID"]

          def gh_get(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "altstore-source-updater",
                      **({"Authorization": f"Bearer {token}"} if token else {}),
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          # 0. Load the existing source file first, so we know what's already recorded.
          with open(source_file, "r", encoding="utf-8") as f:
              source = json.load(f)
          app = source["apps"][0]
          versions = app.setdefault("versions", [])
          current_top_version = versions[0]["version"] if versions else None

          # 0b. Cheap gate check via the public Atom feed. This needs no auth, doesn't
          # count against the GitHub API rate limit, and is a tiny payload compared to
          # the REST API + .ipa download — so on every run where nothing changed, this
          # is the only network call made. Note this doesn't make the workflow "push
          # triggered" (Actions schedules can only run on a timer, GitHub can't wake
          # one via feed updates) — it just makes each scheduled poll cheap.
          atom_url = f"https://github.com/{repo}/releases.atom"
          atom_req = urllib.request.Request(atom_url, headers={"User-Agent": "altstore-source-updater"})
          with urllib.request.urlopen(atom_req, timeout=30) as r:
              atom_xml = r.read()

          ns = {"atom": "http://www.w3.org/2005/Atom"}
          root = ET.fromstring(atom_xml)
          latest_entry = root.find("atom:entry", ns)
          latest_tag = None
          if latest_entry is not None:
              link_el = latest_entry.find("atom:link", ns)
              href = link_el.get("href") if link_el is not None else ""
              m = re.search(r"/releases/tag/([^/]+)$", href)
              if m:
                  latest_tag = m.group(1)

          if latest_tag is None:
              print("WARNING: Could not parse the Atom feed - falling back to the REST API check.")
          elif current_top_version is not None and (
              latest_tag == current_top_version
              or latest_tag == current_top_version.removesuffix("-beta")
          ):
              print(f"Atom feed's newest tag ({latest_tag}) matches what's already recorded "
                    f"({current_top_version}) - skipping the REST API and download entirely.")
              sys.exit(0)
          else:
              print(f"Atom feed shows '{latest_tag}' vs recorded '{current_top_version}' - checking further.")

          # 1. List recent releases (NOT /releases/latest — that endpoint always
          # skips pre-releases, and NuvioMedia's -beta tags are marked as such,
          # so it would silently keep returning an old stable version forever).
          # Walk newest-to-oldest and use the first one that actually ships an
          # .ipa asset, since some beta tags are published without one.
          releases = gh_get(f"https://api.github.com/repos/{repo}/releases?per_page=10")

          release = None
          ipa_asset = None
          for candidate in releases:
              asset = next(
                  (a for a in candidate["assets"] if a["name"].lower().endswith(".ipa")),
                  None,
              )
              if asset:
                  release = candidate
                  ipa_asset = asset
                  break

          if not release:
              print("No release in the last 10 has an .ipa asset — nothing to do.")
              sys.exit(0)

          # Keep the tag exactly as published (e.g. "0.4.23-beta") so the beta
          # channel stays visible in the version string, rather than trusting
          # Info.plist's CFBundleShortVersionString, which won't carry "-beta".
          tag = release["tag_name"].lstrip("v")
          published = release["published_at"]  # ISO 8601
          is_prerelease = release.get("prerelease", False)
          print(f"Using release {tag} (prerelease={is_prerelease})")

          download_url = ipa_asset["browser_download_url"]

          # 2. Download the .ipa fully (needed for sha256 + Info.plist parsing)
          print(f"Downloading {download_url} ...")
          dl_req = urllib.request.Request(
              download_url,
              headers={"User-Agent": "altstore-source-updater"},
          )
          with urllib.request.urlopen(dl_req, timeout=180) as r:
              ipa_bytes = r.read()

          size = len(ipa_bytes)
          sha256 = hashlib.sha256(ipa_bytes).hexdigest()
          print(f"Downloaded {size} bytes, sha256={sha256}")

          # 3. Pull build/minOS/plist-version metadata out of Payload/*.app/Info.plist.
          plist_version = None
          build_version = None
          min_os_version = None
          plist_name = None
          try:
              with zipfile.ZipFile(io.BytesIO(ipa_bytes)) as z:
                  plist_name = next(
                      (
                          n for n in z.namelist()
                          if n.startswith("Payload/") and n.endswith(".app/Info.plist")
                          and n.count("/") == 2  # main app's Info.plist, not a nested framework/appex
                      ),
                      None,
                  )
                  if plist_name:
                      with z.open(plist_name) as f:
                          plist = plistlib.load(f)
                      plist_version = str(plist.get("CFBundleShortVersionString", ""))
                      build_version = str(plist.get("CFBundleVersion", ""))
                      min_os_version = str(plist.get("MinimumOSVersion", ""))
                      bundle_id = plist.get("CFBundleIdentifier", "")
                      if bundle_id and bundle_id != expected_bundle_id:
                          print(f"WARNING: Info.plist bundle id '{bundle_id}' does not match "
                                f"BUNDLE_ID '{expected_bundle_id}' - check for a mismatch.")
                  else:
                      print("WARNING: Could not find the main app's Info.plist inside the .ipa - "
                            "build/minOS info will be missing for this version.")
          except Exception as e:
              print(f"WARNING: Failed to parse Info.plist ({e}) - build/minOS info will be missing.")

          # Build the version string: prefer the plist's CFBundleShortVersionString
          # as the base (it's the authoritative app version), falling back to the
          # tag with any "-beta" suffix stripped if the plist wasn't readable.
          # Then append "-beta" ourselves based on GitHub's real "prerelease" flag
          # -- this doesn't depend on NuvioMedia's tag-naming convention staying
          # consistent, since we're checking the actual signal, not parsing text.
          base_version = plist_version or (tag[:-5] if tag.endswith("-beta") else tag)
          base_version = base_version[:-5] if base_version.endswith("-beta") else base_version
          version = f"{base_version}-beta" if is_prerelease else base_version

          # 4. app/versions were already loaded in step 0 above.
          already_present = any(
              v.get("version") == version and v.get("buildVersion") == build_version
              for v in versions
          )
          if already_present:
              print(f"Version {version} (build {build_version}) is already in the source - nothing to do.")
              sys.exit(0)

          new_version = {
              "version": version,
              "buildVersion": build_version or "",
              "date": published,
              # localizedDescription is intentionally NOT pulled from the GitHub
              # release body — it carries forward whatever static text you've
              # already set (same treatment as the app-level versionDescription),
              # so edit it by hand in the source file if you want it to change.
              "localizedDescription": (
                  versions[0].get("localizedDescription", "")
                  if versions
                  else app.get("versionDescription", "")
              ),
              "downloadURL": download_url,
              "size": size,
              "sha256": sha256,
          }
          # Only set minOSVersion if we actually recovered one - never overwrite a
          # good manual value with an empty string.
          if min_os_version:
              new_version["minOSVersion"] = min_os_version
          elif versions:
              new_version["minOSVersion"] = versions[0].get("minOSVersion", "")

          # AltStore treats the FIRST entry in "versions" as the latest release
          versions.insert(0, new_version)
          app["versions"] = versions

          # 5. Mirror the newest version into legacy flat fields on the app object.
          # AltStore Classic and forks like Feather read these instead of (or in
          # addition to) the "versions" array - without this, they show a stale
          # version and no size badge even though "versions" is correct.
          app["version"] = new_version["version"]
          app["versionDate"] = published[:10]  # YYYY-MM-DD
          # versionDescription is intentionally left untouched — not mirrored
          app["downloadURL"] = new_version["downloadURL"]
          app["size"] = new_version["size"]
          if "minOSVersion" in new_version:
              app["minOSVersion"] = new_version["minOSVersion"]

          # NOTE: appPermissions / permissions are NOT touched here - entitlements
          # and privacy-usage strings need a human to review against Info.plist,
          # since a wrong auto-fill could make AltStore silently under-report them.

          with open(source_file, "w", encoding="utf-8") as f:
              json.dump(source, f, indent=2, ensure_ascii=False)
              f.write("\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write("changed=true\n")
              gh_out.write(f"version={version}\n")
              gh_out.write(f"build={build_version or ''}\n")
          PY

      - name: Commit & push updated source
        if: steps.update.outputs.changed == 'true'
        env:
          SOURCE_FILE: NuvioiOS.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$SOURCE_FILE"
          git commit -m "chore: update source to v${{ steps.update.outputs.version }} (build ${{ steps.update.outputs.build }})"
          git push
